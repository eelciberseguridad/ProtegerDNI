name: Build Windows Portables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        architecture: [x64, x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.architecture }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Verify architecture
        shell: python
        run: |
          import struct
          expected = 64 if "${{ matrix.architecture }}" == "x64" else 32
          actual = struct.calcsize("P") * 8
          assert actual == expected, (actual, expected)
          print(f"Python architecture: {actual}-bit")

      - name: Build portable
        shell: pwsh
        run: |
          $name = "ProtegerDNI_${{ matrix.architecture }}"
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --windowed `
            --name $name `
            --icon "assets/ProtegerDNI.ico" `
            --version-file "build/version_info.txt" `
            "src/ProtegerDNI.py"

      - name: Generate SHA256
        shell: pwsh
        run: |
          $exe = "dist/ProtegerDNI_${{ matrix.architecture }}.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "$hash  ProtegerDNI_${{ matrix.architecture }}.exe" |
            Set-Content "dist/ProtegerDNI_${{ matrix.architecture }}_SHA256.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProtegerDNI-${{ matrix.architecture }}
          path: |
            dist/ProtegerDNI_${{ matrix.architecture }}.exe
            dist/ProtegerDNI_${{ matrix.architecture }}_SHA256.txt
